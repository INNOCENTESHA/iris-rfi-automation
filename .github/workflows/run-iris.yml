# =============================================================================
# IRIS RFI Daily Run
# -----------------------------------------------------------------------------
# Pipeline
#   1. download_rfi_attachments.py  - pull RFI attachments from Gmail over IMAP
#   2. update_rfi_google_sheets.py  - parse attachments into the RFI Detailed Logs
#   3. update_physical_progress.py  - roll cumulative figures into Physical Progress
#
# REQUIRED repository secrets (Settings > Secrets and variables > Actions):
#   GMAIL_USER          Gmail address that receives the RFI emails
#   GMAIL_APP_PASSWORD  16-character Google App Password (never the account password)
#   GOOGLE_SERVICE_ACCOUNT_B64  base64 of a service-account JSON key    (base64 -w0 key.json)
#
# OPTIONAL repository secrets:
#   N8N_CALLBACK_URL    webhook notified when a run fails
#
# The run aborts immediately if any required secret is missing, so a green tick
# always means the pipeline really did its work.
# =============================================================================

name: IRIS RFI Daily Run

on:
  schedule:
    # 17:00 East Africa Time (UTC+3) == 14:00 UTC
    - cron: "0 14 * * *"

  # n8n triggers this via POST to the GitHub repository_dispatch API:
  #   {"event_type": "run-iris", "client_payload": {"mode": "full-scan"}}
  repository_dispatch:
    types: [run-iris]

  workflow_dispatch:
    inputs:
      mode:
        description: "Mailbox scan mode"
        type: choice
        options:
          - full-scan
          - incremental
        default: full-scan
      physical_progress_live:
        description: "Write Physical Progress for real (leave unchecked for a dry run)"
        type: boolean
        default: false

permissions:
  contents: read

# Two runs must never touch the same spreadsheets at the same time.
concurrency:
  group: iris-rfi-daily
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  IRIS_BASE_DIR: ${{ github.workspace }}/.iris
  RFI_ZIP_DIR: ${{ github.workspace }}/.iris/rfi_zips
  RFI_LOG_PATH: ${{ github.workspace }}/.iris/state/_download_log.json
  GOOGLE_SERVICE_ACCOUNT_PATH: ${{ github.workspace }}/.iris/service-account.json
  LOG_DIR: ${{ github.workspace }}/.iris/logs

jobs:
  run-iris:
    name: Sync RFIs to Google Sheets
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # -- Fail fast, and explain exactly what is missing -----------------------
      - name: Preflight - validate configuration
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_B64 }}
        run: |
          missing=()
          for name in GMAIL_USER GMAIL_APP_PASSWORD GOOGLE_SERVICE_ACCOUNT_B64; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done

          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error title=Missing repository secrets::${missing[*]}"
            {
              echo "## Run aborted - configuration incomplete"
              echo ""
              echo "These repository secrets are not set:"
              for name in "${missing[@]}"; do echo "- \`$name\`"; done
              echo ""
              echo "Add them under **Settings > Secrets and variables > Actions**, then re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "All required secrets are present."

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check || echo "::warning title=Dependency conflict::pip check reported an inconsistency"

      - name: Install archive tooling (RAR support)
        run: |
          sudo apt-get update -qq
          if ! sudo apt-get install -y --no-install-recommends unar p7zip-full; then
            echo "::warning title=RAR support unavailable::RAR attachments will be skipped on this run"
          fi

      - name: Create working directories
        run: mkdir -p "$RFI_ZIP_DIR" "$LOG_DIR" "$(dirname "$RFI_LOG_PATH")"

      # -- Carry the dedup log across runs so we do not re-download everything --
      - name: Restore download state
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.iris/state
            ${{ github.workspace }}/.iris/rfi_zips
          key: iris-download-state-${{ github.run_id }}
          restore-keys: |
            iris-download-state-

      - name: Restore and validate Google service account
        env:
          GOOGLE_SERVICE_ACCOUNT_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_B64 }}
        run: |
          decode() {
            local value="$1" dest="$2" label="$3"
            if ! printf '%s' "$value" | base64 -d > "$dest" 2>/dev/null; then
              echo "::error title=$label is not valid base64::Recreate the secret with: base64 -w0 <file>"
              exit 1
            fi
            if ! python -c "import json,sys; json.load(open(sys.argv[1]))" "$dest" 2>/dev/null; then
              echo "::error title=$label did not decode to JSON::The decoded file is empty or malformed. Recreate it with: base64 -w0 <file>"
              exit 1
            fi
            chmod 600 "$dest"
          }

          decode "$GOOGLE_SERVICE_ACCOUNT_B64" "$GOOGLE_SERVICE_ACCOUNT_PATH" "GOOGLE_SERVICE_ACCOUNT_B64"
          echo "Google service account credentials restored and validated."

      # -- Step 1 ---------------------------------------------------------------
      - name: Step 1/3 - Download RFI attachments from Gmail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          N8N_CALLBACK_URL: ${{ secrets.N8N_CALLBACK_URL }}
          IRIS_FULL_SCAN: ${{ (github.event.inputs.mode || github.event.client_payload.mode || 'full-scan') == 'full-scan' && '1' || '0' }}
        run: |
          set -o pipefail
          python download_rfi_attachments.py 2>&1 | tee "$LOG_DIR/01-download.log"

      - name: List downloaded files (debug)
        run: |
          echo "Contents of $RFI_ZIP_DIR:"
          ls -la "$RFI_ZIP_DIR" | tee "$LOG_DIR/01b-listing.log"
          echo
          echo "Total size:"
          du -sh "$RFI_ZIP_DIR"

      # -- Step 2 ---------------------------------------------------------------
      - name: Step 2/3 - Update the RFI Detailed Log spreadsheets
        env:
          N8N_CALLBACK_URL: ${{ secrets.N8N_CALLBACK_URL }}
          MODE: ${{ github.event.inputs.mode || github.event.client_payload.mode || 'full-scan' }}
        run: |
          set -o pipefail
          python update_rfi_google_sheets.py 2>&1 | tee "$LOG_DIR/02-rfi-sheets.log"

      # -- Step 3 ---------------------------------------------------------------
      # Defaults to a dry run. Tick 'physical_progress_live' on a manual run to write.
      - name: Step 3/3 - Update Physical Progress
        env:
          PHYS_PROGRESS_LIVE: ${{ github.event.inputs.physical_progress_live == 'true' && '1' || '0' }}
        run: |
          set -o pipefail
          if [ "$PHYS_PROGRESS_LIVE" = "1" ]; then
            echo "LIVE mode - the Physical Progress sheets will be written."
            python update_physical_progress.py 2>&1 | tee "$LOG_DIR/03-physical-progress.log"
          else
            echo "DRY-RUN mode - no writes will be made."
            python update_physical_progress.py --dry-run 2>&1 | tee "$LOG_DIR/03-physical-progress.log"
          fi

      # -- Always keep the evidence --------------------------------------------
      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: iris-logs-run-${{ github.run_number }}
          path: ${{ github.workspace }}/.iris/logs
          retention-days: 30
          if-no-files-found: warn

      - name: Write run summary
        if: always()
        run: |
          {
            echo "## IRIS RFI run #${{ github.run_number }}"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Trigger | ${{ github.event_name }} |"
            echo "| Mode | ${{ github.event.inputs.mode || github.event.client_payload.mode || 'full-scan' }} |"
            echo "| Physical Progress | ${{ github.event.inputs.physical_progress_live == 'true' && 'LIVE' || 'dry run' }} |"
            echo "| Result | ${{ job.status }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          for f in "$LOG_DIR"/*.log; do
            [ -f "$f" ] || continue
            {
              echo "<details><summary>$(basename "$f") - last 25 lines</summary>"
              echo ""
              echo '```'
              tail -n 25 "$f"
              echo '```'
              echo "</details>"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          done

      # -- Alerting. This step must never be the thing that fails the run. ------
      - name: Notify n8n on failure
        if: failure()
        env:
          N8N_CALLBACK_URL: ${{ secrets.N8N_CALLBACK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$N8N_CALLBACK_URL" ]; then
            echo "::notice title=No failure callback configured::Set the N8N_CALLBACK_URL secret to receive alerts."
            exit 0
          fi

          payload=$(jq -nc \
            --arg url "$RUN_URL" \
            --arg wf "IRIS RFI Daily Run" \
            '{status: "error", source: "github-actions", workflow: $wf, message: "IRIS run failed - check the Actions log", run_url: $url}')

          if ! curl -sS --fail-with-body --max-time 30 \
                 -X POST "$N8N_CALLBACK_URL" \
                 -H 'Content-Type: application/json' \
                 -d "$payload"; then
            echo "::warning title=Failure callback not delivered::Could not POST to N8N_CALLBACK_URL"
          fi
