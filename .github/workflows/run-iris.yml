name: IRIS RFI Daily Run

on:
  # Daily at 17:00 EAT (14:00 UTC)
  schedule:
    - cron: "0 14 * * *"

  # n8n triggers this via POST to GitHub repository_dispatch API
  # Body: {"event_type": "run-iris", "client_payload": {"mode": "full-scan"}}
  repository_dispatch:
    types: [run-iris]

  # Manual trigger (for testing)
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        default: "full-scan"
        required: false

jobs:
  run-iris:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # unrar binary is needed for RAR attachment extraction (rarfile)
          sudo apt-get update && sudo apt-get install -y unrar || true

      # Google Sheets OAuth — restore token + client secret from base64 secrets
      - name: Restore Google credentials
        env:
          GOOGLE_TOKEN_B64: ${{ secrets.GOOGLE_TOKEN_B64 }}
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
        run: |
          mkdir -p ~/.iris
          echo "$GOOGLE_TOKEN_B64" | base64 -d > ~/.iris/token.json
          echo "$GOOGLE_CREDS_B64" | base64 -d > ~/.iris/credentials.json

      # STEP 1 (was missing): download RFI attachments from Gmail via IMAP
      - name: Download RFI attachments
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RFI_ZIP_DIR: /tmp/rfi_zips
        run: |
          mkdir -p /tmp/rfi_zips
          python download_rfi_attachments.py

      # STEP 2: parse the downloaded zips and update Google Sheets
      - name: Update Google Sheets from RFI zips
        env:
          GOOGLE_TOKEN_PATH: /home/runner/.iris/token.json
          GOOGLE_CREDS_PATH: /home/runner/.iris/credentials.json
          RFI_ZIP_DIR: /tmp/rfi_zips
          N8N_CALLBACK_URL: ${{ secrets.N8N_CALLBACK_URL }}
          MODE: ${{ github.event.inputs.mode || github.event.client_payload.mode || 'full-scan' }}
        run: python update_rfi_google_sheets.py

      - name: Notify n8n on failure
        if: failure()
        env:
          N8N_CALLBACK_URL: ${{ secrets.N8N_CALLBACK_URL }}
        run: |
          curl -s -X POST "$N8N_CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -d '{"status":"error","source":"github-actions","message":"IRIS run failed — check Actions log"}'
