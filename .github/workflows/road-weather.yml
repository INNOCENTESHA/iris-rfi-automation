name: IRIS Road Weather Advisory

# Replaces the two n8n scheduleTrigger nodes.
# GitHub cron is UTC; Africa/Dar_es_Salaam is UTC+3 with no DST.
#   02:30 UTC -> 05:30 EAT  (Pemba)
#   02:45 UTC -> 05:45 EAT  (Unguja)
# Note: scheduled runs on GitHub can start a few minutes late under load.

on:
  schedule:
    - cron: '30 2 * * *'     # Pemba
    - cron: '45 2 * * *'     # Unguja
  workflow_dispatch:
    inputs:
      island:
        description: Island to run
        required: true
        default: both
        type: choice
        options: [both, unguja, pemba]
      dry_run:
        description: Render only, do not send email
        required: false
        default: false
        type: boolean

concurrency:
  group: road-weather-${{ github.event.schedule || github.event.inputs.island }}
  cancel-in-progress: false

permissions:
  contents: read

# Private dashboard storage (Cloudflare Workers KV). Not secrets; replace with your own when reusing.
env:
  CF_ACCOUNT_ID: 468a893a9e1ab4c82dcefd5ae849028f
  CF_KV_NAMESPACE_ID: 705a4e926c1b4bdf8cf1bd8d9c6130dc

jobs:
  advisory:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-oauthlib

      - name: Restore Google credentials
        env:
          GOOGLE_TOKEN_B64: ${{ secrets.GOOGLE_TOKEN_B64 }}
        run: |
          if [ -z "$GOOGLE_TOKEN_B64" ]; then
            echo "::error::GOOGLE_TOKEN_B64 secret is not set"; exit 1
          fi
          mkdir -p "$HOME/.iris"
          echo "$GOOGLE_TOKEN_B64" | base64 -d > "$HOME/.iris/token.json"
          python -c "import json,sys; json.load(open('$HOME/.iris/token.json')); print('token.json parsed OK')"

      - name: Resolve island from trigger
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "30 2 * * *" ]; then
              echo "island=pemba" >> "$GITHUB_OUTPUT"
            else
              echo "island=unguja" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "island=${{ github.event.inputs.island }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch dashboard index
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          SITE="$RUNNER_TEMP/site"
          mkdir -p "$SITE/advisories"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::warning::CLOUDFLARE_API_TOKEN not set - dashboard will not be updated"; exit 0; }
          code=$(curl -sS -o "$SITE/advisories/index.json" -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$CF_KV_NAMESPACE_ID/values/advisories%2Findex.json" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          if [ "$code" = "200" ]; then
            echo "existing index: $(jq length "$SITE/advisories/index.json") entries"
          elif [ "$code" = "404" ]; then
            rm -f "$SITE/advisories/index.json"; echo "no index yet - starting fresh"
          else
            rm -f "$SITE/advisories/index.json"
            echo "::error::could not read dashboard index (HTTP $code)"; exit 1
          fi

      - name: Run advisory
        env:
          IRIS_BASE_DIR: ${{ github.workspace }}
          GOOGLE_TOKEN_PATH: /home/runner/.iris/token.json
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-5-5' }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WEATHER_RECIPIENTS_JSON: ${{ secrets.WEATHER_RECIPIENTS_JSON }}
          WEATHER_PROVIDER: ${{ vars.WEATHER_PROVIDER || 'openmeteo' }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL || 'https://mindfreedom.co.tz/weather/' }}
          PYTHONUTF8: '1'
        run: |
          python iris_road_weather.py \
            --island "${{ steps.pick.outputs.island }}" \
            --publish "$RUNNER_TEMP/site" \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: Upload rendered advisory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advisory-${{ steps.pick.outputs.island }}-${{ github.run_id }}
          path: logs/*.html
          if-no-files-found: warn
          retention-days: 30


      - name: Publish to private dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/site"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || exit 0
          [ -f "$SITE/advisories/index.json" ] || { echo "Nothing to publish"; exit 0; }
          cd "$SITE"
          put() {  # put <key> <content-type>
            key=$(jq -rn --arg k "$1" '$k|@uri')
            curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$CF_KV_NAMESPACE_ID/values/$key" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: $2" \
              --data-binary "@$1" > "$RUNNER_TEMP/resp.json"
            jq -e '.success' "$RUNNER_TEMP/resp.json" > /dev/null || { jq '.errors' "$RUNNER_TEMP/resp.json"; exit 1; }
            echo "uploaded $1"
          }
          find advisories -name '*.html' | sort | while read -r f; do put "$f" "text/html"; done
          put "advisories/index.json" "application/json"
