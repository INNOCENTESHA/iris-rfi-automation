<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IRIS Road Weather Dashboard</title>
<style>
:root{--bg:#0a1020;--card:#111a2e;--line:#1f2b47;--txt:#e6ecf8;--mut:#8b98b5;--navy:#1a2e4a;
--GOOD:#22c55e;--MODERATE:#eab308;--SEVERE:#f97316;--EXTREME:#ef4444;--BAD:#be123c;--NONE:#475569}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.5 "Segoe UI",Tahoma,Geneva,Verdana,sans-serif}
.hero{background:radial-gradient(1200px 400px at 15% -10%,#2b4a8a 0%,transparent 60%),
radial-gradient(900px 380px at 95% 0%,#5b3a9a 0%,transparent 55%),linear-gradient(180deg,#101a33,#0a1020);
padding:30px 28px 26px;border-bottom:1px solid var(--line)}
.hero-in,.wrap{max-width:1400px;margin:0 auto}
.hero h1{font-size:27px;font-weight:700;letter-spacing:.2px}
.hero h1 span{background:linear-gradient(90deg,#5cc8ff,#a78bfa,#f0a6d8);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);margin-top:6px;font-size:14px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap}
.seg{display:inline-flex;background:#0d1528;border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{font:inherit;font-weight:600;color:var(--mut);background:none;border:0;padding:8px 22px;border-radius:9px;cursor:pointer}
.seg button.on{background:linear-gradient(135deg,#2f6fed,#6d4ee6);color:#fff}
.wrap{padding:22px 28px 40px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:1.1px;color:var(--mut)}
.kpi .v{font-size:32px;font-weight:700;margin-top:6px;line-height:1.1}
.kpi .s{font-size:12.5px;color:var(--mut);margin-top:6px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:1.3px;color:var(--mut);margin:26px 0 12px}
.pill{display:inline-block;padding:3px 12px;border-radius:999px;font-size:11.5px;font-weight:700;color:#0a1020}
.roads{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.road{border-left:4px solid var(--c)}
.road .n{font-weight:600;font-size:14px;line-height:1.35;min-height:38px}
.road .r{display:flex;justify-content:space-between;align-items:center;margin:10px 0 12px;font-size:13px;color:var(--mut)}
.road .ic{font-size:26px}
.meter{display:grid;grid-template-columns:54px 1fr 62px;align-items:center;gap:10px;font-size:12.5px;color:var(--mut);margin-top:7px}
.track{height:7px;background:#1b2540;border-radius:6px;overflow:hidden}
.fill{height:100%;border-radius:6px}
.meter b{color:var(--txt);text-align:right;font-weight:600}
.out{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}
.day{text-align:center;border-top:4px solid var(--c);padding:14px 8px}
.day .ic{font-size:30px;margin:6px 0}
.day .t{font-weight:700}.day .m{font-size:12px;color:var(--mut);margin-top:3px}
.hist{display:flex;gap:5px;flex-wrap:wrap}
.cell{width:26px;height:38px;border-radius:6px;background:var(--c);border:2px solid transparent;cursor:pointer;opacity:.85}
.cell:hover{opacity:1;transform:translateY(-2px)}.cell.on{border-color:#fff;opacity:1}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
.viewer{padding:0;overflow:hidden}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--mut);flex-wrap:wrap}
.bar a{color:#8ab4ff;font-weight:600;text-decoration:none}
iframe{width:100%;height:900px;border:0;display:block;background:#f4f6f9}
.empty{padding:50px 20px;text-align:center;color:var(--mut)}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.out{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="hero"><div class="hero-in top">
  <div>
    <h1><span>IRIS-LUPTAN JV</span> · Road Weather Dashboard</h1>
    <p id="sub">Construction weather status for the Unguja and Pemba road projects</p>
  </div>
  <div class="seg" id="seg">
    <button data-island="unguja">Unguja</button><button data-island="pemba">Pemba</button>
  </div>
</div></div>
<div class="wrap" id="app"><div class="empty">Loading advisories…</div></div>
<script>
const ORDER=["BAD","EXTREME","SEVERE","MODERATE","GOOD"];
let all=[],island="unguja",cur=null;
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const col=s=>"var(--"+(s||"NONE")+")";
const fmt=d=>{const [y,m,dd]=d.split("-");return dd+"-"+m+"-"+y;};
const pill=s=>'<span class="pill" style="background:'+col(s)+(s==="BAD"?';color:#fff':'')+'">'+(s||"NO ROADS")+'</span>';

function render(){
  document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.island===island));
  const rows=all.filter(e=>e.island===island);
  const app=document.getElementById("app");
  if(!rows.length){app.innerHTML='<div class="card empty">No advisories have been published yet for this island. The first one appears after the next scheduled run.</div>';return;}
  if(!cur||cur.island!==island)cur=rows[0];
  const e=cur,roads=e.road_list||[],out=e.outlook||[];
  const peakP=Math.max(0,...roads.map(r=>r.precip||0)),peakW=Math.max(0,...roads.map(r=>r.wind||0));
  const tally=ORDER.filter(s=>(e.tally||{})[s]).map(s=>e.tally[s]+" "+s.toLowerCase()).join(" · ");
  let h='<div class="kpis">'+
    '<div class="card kpi"><div class="l">Works status</div><div class="v" style="color:'+col(e.worst)+'">'+(e.worst||"—")+'</div><div class="s">'+esc(e.label)+' · '+fmt(e.date)+'</div></div>'+
    '<div class="card kpi"><div class="l">Roads in scope</div><div class="v">'+e.roads+'</div><div class="s">'+(tally||"no active roads")+'</div></div>'+
    '<div class="card kpi"><div class="l">Site-work RFIs</div><div class="v">'+e.rfis+'</div><div class="s">last 3 days · '+esc((e.codes||[]).slice(0,5).join(", ")||"none")+'</div></div>'+
    '<div class="card kpi"><div class="l">Peak rain risk</div><div class="v">'+peakP+'%</div><div class="s">peak wind '+peakW+' km/h</div></div></div>';
  h+='<h2>Roads today</h2>';
  h+=roads.length?'<div class="roads">'+roads.map(r=>
    '<div class="card road" style="--c:'+col(r.status)+'"><div class="n">'+esc(r.name)+'</div>'+
    '<div class="r"><span><span class="ic">'+esc(r.icon)+'</span> '+esc(r.text)+'</span>'+pill(r.status)+'</div>'+
    '<div class="r" style="margin:0"><span>Temperature</span><b style="color:var(--txt)">'+(r.tmin==null?"—":r.tmin+"–"+r.tmax+" °C")+'</b></div>'+
    '<div class="meter"><span>Rain</span><div class="track"><div class="fill" style="width:'+Math.min(100,r.precip)+'%;background:linear-gradient(90deg,#38bdf8,#6366f1)"></div></div><b>'+r.precip+'%</b></div>'+
    '<div class="meter"><span>Wind</span><div class="track"><div class="fill" style="width:'+Math.min(100,r.wind/0.7)+'%;background:linear-gradient(90deg,#34d399,#facc15)"></div></div><b>'+r.wind+' km/h</b></div></div>').join("")+'</div>'
    :'<div class="card empty">No site works were recorded in the last 3 days, so no roads are in scope.</div>';
  if(out.length){h+='<h2>7-day outlook</h2><div class="out">'+out.map(d=>
    '<div class="card day" style="--c:'+col(d.status)+'"><div class="t">'+esc(d.day)+'</div><div class="m">'+esc(d.date)+'</div><div class="ic">'+esc(d.icon)+'</div>'+
    '<div class="t">'+esc(d.high)+'° / '+esc(d.low)+'°</div><div class="m">rain '+esc(d.precip)+'% · '+esc(d.wind)+' km/h</div></div>').join("")+'</div>';}
  h+='<h2>Status history</h2><div class="card"><div class="hist">'+rows.slice(0,60).reverse().map(x=>
    '<div class="cell'+(x.file===e.file?" on":"")+'" style="--c:'+col(x.worst)+'" title="'+fmt(x.date)+' · '+(x.worst||"no roads")+'" data-f="'+esc(x.file)+'"></div>').join("")+'</div>'+
    '<div class="legend">'+ORDER.slice().reverse().map(s=>'<span><i style="--c:'+col(s)+'"></i>'+s+'</span>').join("")+'<span><i style="--c:'+col(null)+'"></i>NO ROADS</span></div></div>';
  h+='<h2>Full advisory</h2><div class="card viewer"><div class="bar"><span>'+esc(e.label)+' · '+fmt(e.date)+' · generated '+esc(e.generated)+'</span>'+
    '<a href="'+esc(e.file)+'" target="_blank" rel="noopener">Open full page ↗</a></div><iframe title="Advisory" src="'+esc(e.file)+'"></iframe></div>';
  app.innerHTML=h;
  app.querySelectorAll(".cell").forEach(c=>c.onclick=()=>{cur=all.find(x=>x.file===c.dataset.f);render();window.scrollTo({top:0,behavior:"smooth"});});
}
document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{island=b.dataset.island;cur=null;render();});
function start(j){all=j;if(all.length)island=all[0].island;render();}
if(window.__PREVIEW_DATA)start(window.__PREVIEW_DATA);
else fetch("advisories/index.json?t="+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json();}).then(start).catch(()=>start([]));
</script>
</body>
</html>
